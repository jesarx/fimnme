# FIMNME — configuración de OpenDKIM (ADR 0030).
# Software libre bajo la licencia GNU GPL v3.0; véase el archivo LICENSE.
#
# La instala deploy/correo/instalar_correo.sh como /etc/opendkim.conf.
# OpenDKIM sólo FIRMA: el servidor no recibe correo, así que no hay nada que
# verificar. Escucha en 127.0.0.1:8891 y Postfix le pasa cada mensaje antes
# de entregarlo. Las claves y los dominios que firma están en las tablas de
# /etc/opendkim, que escribe el guion.

Syslog                  yes
SyslogSuccess           yes
LogWhy                  yes

# Sólo firma (s); nunca verifica.
Mode                    s

# Puerto TCP local en lugar de un socket de archivo: el smtpd de Postfix en
# Debian corre enjaulado (chroot) y no alcanzaría /run/opendkim.
Socket                  inet:8891@127.0.0.1
PidFile                 /run/opendkim/opendkim.pid
UserID                  opendkim
UMask                   007

# «relaxed» en las cabeceras tolera los cambios de espacios que hacen algunos
# servidores intermedios; «simple» en el cuerpo es lo más estricto.
Canonicalization        relaxed/simple

# Cabeceras firmadas. Se nombran porque la lista de fábrica deja fuera
# Message-ID, MIME-Version y Content-Type (comprobado): sin ellas firmadas, un
# intermediario podría cambiar la estructura del mensaje (los adjuntos) sin
# romper la firma. Las ausentes en un mensaje simplemente no se firman.
SignHeaders             From,Sender,Reply-To,To,Cc,Subject,Date,Message-ID,In-Reply-To,References,MIME-Version,Content-Type,Content-Transfer-Encoding,Content-Language,Auto-Submitted

# Firma también la AUSENCIA de un segundo From: nadie puede añadir uno después
# sin invalidar la firma.
OversignHeaders         From

# Qué clave usa cada remitente.
KeyTable                /etc/opendkim/KeyTable
SigningTable            refile:/etc/opendkim/SigningTable

# Sólo se firma lo que entra desde la propia máquina.
InternalHosts           /etc/opendkim/TrustedHosts
ExternalIgnoreList      /etc/opendkim/TrustedHosts

# Con un error interno, OpenDKIM devuelve error temporal: el mensaje se
# reintenta más tarde y nunca sale sin firma.
On-InternalError        tempfail
